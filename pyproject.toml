[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geocodebr"
version = "0.0.1"
description = "Geolocalizacao de enderecos brasileiros com DuckDB"
readme = "python-package/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.0.0",
  "h3>=4.0.0",
  "numpy>=1.26.0",
  "platformdirs>=4.0.0",
  "pyarrow>=15.0.0",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
  "enderecobr>=0.2.0",
  "polars>=1.0",
  "pandas>=2.0"
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.14.0",
  "pyproj>=3.6.0",
  "shapely>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python-package/geocodebr"]

[tool.pytest.ini_options]
pythonpath = ["python-package"]
testpaths = ["python-package/tests"]
markers = [
  "r_parity: compares Python outputs against the local R package outputs",
]
