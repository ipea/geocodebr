[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geocodebr"
version = "0.0.1"
description = "Geolocalizacao de enderecos brasileiros com DuckDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.0.0",
  "pyarrow>=15.0.0",
  "requests>=2.31.0",
  "platformdirs>=4.0.0",
  "tqdm>=4.66.0",
  "h3>=4.0.0",
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.14.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
]
test = [
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geocodebr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
